<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="CSS/geral.css">
    <link rel="stylesheet" href="CSS/cadastro.css">
</head>

<body>

    <header class="cabecalho-login">
        <h2 class="logoLogin">
            <img src="Imagens/logos/loginlogo.png" alt="logo da página de login" class="logoLoja">
        </h2>

        <nav class="links-cadastro">
            <a href="index.html">voltar à página inicial</a>
            <a href="contato.html">contato</a>
            <a href="sobre.html">sobre nós</a>
            <a href="cadastro.html">cadastre-se</a>
        </nav>
    </header>

    <main class="pagina-login">

        <form id="login">
            <h1>login</h1>

            <label for="logEmail">e-mail:</label>
            <input type="email" id="logEmail" name="logEmail" placeholder="exemplo@dominio.com" required
                oninvalid="this.setCustomValidity('insira um e-mail válido')" oninput="this.setCustomValidity('')">

            <br><br>

            <label for="logSenha">senha:</label>
            <input type="password" id="logSenha" name="logSenha" placeholder="mínimo 8 caracteres" required
                minlength="8" oninvalid="this.setCustomValidity('sua senha precisa ter pelo menos 8 caracteres')"
                oninput="this.setCustomValidity('')">

            <br><br>

            <input type="submit" value="entrar">

            <div class="opcoesLogin">
                <label class="lembrar-senha">
                    <input type="checkbox">
                    lembrar senha
                </label>

                <a href="#">esqueci minha senha</a>
            </div>

            <div class="register-link">
                <p>não tem uma conta? <a href="cadastro.html">cadastre-se</a></p>
            </div>
        </form>

    </main>

    <footer class="rodape">

        <div class="redes-rodape">
            <a href="https://www.instagram.com/juliodossi_" target="_blank">
                <img src="Imagens/icons/instaicon.png" alt="instagram">
            </a>

            <a href="https://wa.me/5527996681009" target="_blank">
                <img src="Imagens/icons/wppicon.png" alt="whatsapp">
            </a>

            <a href="https://x.com/juio_fd" target="_blank">
                <img src="Imagens/icons/xicon.png" alt="x">
            </a>
        </div>

        <div class="texto-rodape">
            <p>Noventa minutos - Todos os direitos reservados ©</p>
            <p>Roupas e artigos esportivos com qualidade e bom preço.</p>
        </div>

    </footer>

</body>

</html>
